spring:
  application:
    name: exam-warehouse
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/project_anhan_db}
    username: ${DATABASE_USERNAME:exam}
    password: ${DATABASE_PASSWORD:exam}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        default_batch_fetch_size: 32
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 40MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    access-token-expiration: 15m
    refresh-token-expiration: 7d
  elo:
    default-rating: 1000
    k-factor: 24
  seed:
    enabled: ${DEV_SEED_ENABLED:false}
    ts10-exam-set: ${SEED_TS10:false}
    ts10-image-dir: ${TS10_IMAGE_DIR:}

  ai:
    enabled: ${APP_AI_ENABLED:true}
    model-name: ${OPENAI_MODEL:gpt-4o-mini}
    math-service-url: ${MATH_AI_SERVICE_URL:http://localhost:8000}

management:
  endpoints:
    web:
      exposure:
        include: health

