seed: 42
model:
  type: mlp
  input_size: 1
  hidden_dim1: 64
  hidden_dim2: 32
  output_size: 1
training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.01
  optimizer: adam
  early_stopping_patience: 15
  gradient_clip_norm: 1.0
scheduler:
  use_scheduler: true
  scheduler_type: ReduceLROnPlateau
  scheduler_patience: 5
  scheduler_factor: 0.5
data:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  dataset_version: v2_nonlinear
  num_samples: 3000
